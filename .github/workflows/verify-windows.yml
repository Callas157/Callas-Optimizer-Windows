name: Validar correções no Windows

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Verificar versão e executar testes
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          python scripts/check_version.py ('v' + (Get-Content VERSION -Raw).Trim())
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke_gui.py
      - name: Compilar aplicativo e instalador
        shell: pwsh
        run: |
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $env:CALLAS_VERSION = (Get-Content VERSION -Raw).Trim()
          & $iscc 'installer/CallasOptimizer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_build.py
      - name: Validar troca de DNS IPv4 no runner descartável
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("src").resolve()))
          from network_dns import _configure, change_dns, configured_providers
          from windows_actions import cmd, dns_interfaces

          initial = next(adapter for adapter in dns_interfaces() if adapter.eligible and adapter.effective)

          def read_target():
              return [adapter for adapter in dns_interfaces() if adapter.guid == initial.guid]

          # Altera só um adaptador da VM efêmera e restaura o estado original
          # mesmo após uma falha de teste. As verificações usam consultas locais.
          try:
              change_dns("dns_cloudflare", read_target, cmd)
              assert configured_providers(read_target()) == {"dns_cloudflare"}
              change_dns("dns_google", read_target, cmd)
              assert configured_providers(read_target()) == {"dns_google"}
              change_dns("dns_cloudflare", read_target, cmd)
              assert configured_providers(read_target()) == {"dns_cloudflare"}
              change_dns("dns_cloudflare_auto", read_target, cmd)
              assert read_target()[0].static == ()
          finally:
              _configure(cmd, initial.index, initial.static)
              assert read_target()[0].static == initial.static
          print("Cloudflare, Google, volta ao automático e configuração original confirmados no Windows.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Agendar e cancelar desligamento no runner descartável
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          import subprocess
          import sys
          from uuid import uuid4

          sys.path.insert(0, str(Path("src").resolve()))
          from windows_actions import HOME, remaining_shutdown_minutes

          app = Path("dist/Callas_Optimizer_Windows_x64/Callas_Optimizer_Windows_x64.exe").resolve()

          def run_action(action, *options):
              report = HOME / f"acao-{uuid4().hex}.json"
              try:
                  run = subprocess.run([str(app), "--callas-task", action, "--callas-report",
                                        report.name, "--callas-profile", str(HOME), *options], timeout=25)
                  assert report.is_file(), f"Sem relatório de {action}: {run.returncode}"
                  result = json.loads(report.read_text(encoding="utf-8"))
                  assert run.returncode == 0 and result["ok"], result["message"]
              finally:
                  report.unlink(missing_ok=True)
                  report.with_suffix(".progress").unlink(missing_ok=True)

          # O prazo é maior que o limite de 25 minutos do job.
          try:
              run_action("shutdown_custom", "--shutdown-minutes", "34")
              assert remaining_shutdown_minutes() == 34
              run_action("shutdown_cancel")
              assert remaining_shutdown_minutes() is None
          finally:
              subprocess.run(["shutdown.exe", "/a"], capture_output=True, timeout=10)
          print("O Windows agendou e cancelou o temporizador pelo executável.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Examinar o disco do runner pelo executor administrativo
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          import sys
          import time
          from uuid import uuid4

          sys.path.insert(0, str(Path("src").resolve()))
          from windows_actions import ElevatedAction, HOME, admin

          assert admin(), "O runner precisa ter o token administrativo para executar o teste."
          app = Path("dist/Callas_Optimizer_Windows_x64/Callas_Optimizer_Windows_x64.exe").resolve()
          report = HOME / f"acao-{uuid4().hex}.json"
          intermediate = report.with_suffix(".progress")
          args = ["--callas-task", "repair_disk", "--callas-report", report.name, "--callas-profile", str(HOME)]
          process = ElevatedAction(app, args)
          seen_progress = 0
          while (code := process.poll()) is None:
              try:
                  state = json.loads(intermediate.read_text(encoding="utf-8"))
                  percent = state["percent"]
              except (OSError, ValueError):
                  percent = 0
              assert 0 <= percent < 100
              if percent > seen_progress:
                  seen_progress = percent
                  print(f"Progresso durante o exame: {seen_progress}%", flush=True)
              time.sleep(0.25)
          intermediate.unlink(missing_ok=True)
          assert report.is_file(), f"Sem relatório do CHKDSK. Código do processo: {code}"
          result = json.loads(report.read_text(encoding="utf-8"))
          report.unlink()
          print(result["message"])
          assert code == 0 and result["ok"], "O aplicativo não concluiu o exame do disco."
          assert seen_progress > 0, "O CHKDSK não publicou porcentagem intermediária."
          '@ | python -
      - name: Testar atualização real do Setup 8.9.3
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/test_direct_upgrade.ps1 -CurrentSetup (Resolve-Path 'dist/Callas_Optimizer_Setup_x64.exe').Path
      - name: Disponibilizar Setup de teste
        uses: actions/upload-artifact@v4
        with:
          name: Callas-Optimizer-Setup-Windows-x64
          path: |
            dist/Callas_Optimizer_Setup_x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
