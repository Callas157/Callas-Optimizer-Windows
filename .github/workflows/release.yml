name: Testar e publicar Callas Optimizer Windows

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: callas-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Baixar fontes
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar dependencias do desktop e builder
        run: python -m pip install -r requirements-build.txt
      - name: Selecionar e validar versao
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'v' + (Get-Content VERSION -Raw).Trim() }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          python scripts/check_version.py $tag
      - name: Rodar testes de seguranca e funcionamento
        run: python -m unittest discover -s tests -v
      - name: Teste de interface Qt sem tela
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          CALLAS_SMOKE: '1'
        run: python tests/smoke_gui.py
      - name: Gerar aplicativo Windows x64
        run: python scripts/build.py
      - name: Preparar Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 nao instalado' }
      - name: Gerar instalador Windows
        shell: pwsh
        run: |
          $env:CALLAS_VERSION = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\CallasOptimizer.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Erro ao compilar instalador' }
          if (-not (Test-Path "dist/Callas_Optimizer_Setup_x64.exe")) { throw "Setup nao gerado" }
      - name: Testar instalacao e icones dos atalhos no Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'dist/Callas_Optimizer_Setup_x64.exe').Path
          $dest = Join-Path $env:RUNNER_TEMP 'CallasOptimizerIconSmoke'
          $arguments = '/VERYSILENT /NORESTART /SUPPRESSMSGBOXES /TASKS=desktopicon /DIR="' + $dest + '"'
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup de teste falhou: $($process.ExitCode)" }
          $app = Join-Path $dest 'Callas_Optimizer_Windows_x64.exe'
          $ico = Join-Path $dest 'CallasOptimizer.ico'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) { throw 'Executavel instalado ausente' }
          if (-not (Test-Path -LiteralPath $ico -PathType Leaf)) { throw 'Arquivo ICO instalado ausente' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::new($ico)
          try { if ($icon.Width -lt 16) { throw 'ICO instalado invalido' } }
          finally { $icon.Dispose() }
          $startLinks = @(
            (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Callas Optimizer.lnk'),
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Callas Optimizer.lnk')
          )
          $desktopLinks = @(
            (Join-Path $env:PUBLIC 'Desktop\Callas Optimizer.lnk'),
            (Join-Path $env:USERPROFILE 'Desktop\Callas Optimizer.lnk')
          )
          $shell = New-Object -ComObject WScript.Shell
          foreach ($candidates in @($startLinks, $desktopLinks)) {
            $link = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (-not $link) { throw "Atalho nao criado: $($candidates -join ', ')" }
            $shortcut = $shell.CreateShortcut($link)
            if ($shortcut.TargetPath -ine $app) { throw "Destino errado no atalho $link : $($shortcut.TargetPath)" }
            if ($shortcut.IconLocation -notmatch '(?i)CallasOptimizer\.ico') {
              throw "Icone errado no atalho $link : $($shortcut.IconLocation)"
            }
          }
          Write-Host 'Instalacao e icones dos atalhos validados no Windows.'

      - name: Validar executaveis e hashes
        run: python scripts/verify_build.py
      - name: Publicar somente Setup na Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # Release existente: preservar o Setup ja publicado, recalcular checksum
            # usando o digest do asset existente (builds repetidos podem diferir).
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel ler release existente' }
            $setups = @($release.assets | Where-Object { $_.name -ceq 'Callas_Optimizer_Setup_x64.exe' })
            if ($setups.Count -ne 1) { throw 'Release existente sem Setup unico' }
            $digest = [string]$setups[0].digest
            if ($digest -cnotmatch '^sha256:([0-9a-fA-F]{64})$') { throw 'Digest SHA-256 do Setup indisponivel' }
            "$($Matches[1])  Callas_Optimizer_Setup_x64.exe" | Set-Content dist/SHA256SUMS.txt -Encoding Ascii
            gh release upload $env:RELEASE_TAG dist/SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao corrigir checksum da Release' }
            Write-Output 'Release mantida: checksum apenas do Setup.'
            exit 0
          }
          gh release create $env:RELEASE_TAG dist/Callas_Optimizer_Setup_x64.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Callas Optimizer $env:RELEASE_TAG" --notes-file CHANGELOG.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar Release' }

  remover-portateis-antigos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Excluir executaveis portateis de todas as Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | .assets[] | select(.name == "Callas_Optimizer_Windows_x64.exe") | .id' |
            while read -r id; do
              if [[ -n "$id" ]]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
                echo "Portatil retirado: $id"
              fi
            done
          # Releases antigas sem instalador nao devem oferecer checksum orfao.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select((.assets | map(.name) | index("Callas_Optimizer_Setup_x64.exe")) == null) | .assets[] | select(.name == "SHA256SUMS.txt") | .id' |
            while read -r id; do
              if [[ -n "$id" ]]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
                echo "Checksum antigo retirado: $id"
              fi
            done
