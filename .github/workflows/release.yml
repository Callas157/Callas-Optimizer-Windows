name: Testar e publicar Callas Optimizer Windows

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: callas-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Baixar fontes
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar dependencias do desktop e builder
        run: python -m pip install -r requirements-build.txt
      - name: Selecionar e validar versao
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'v' + (Get-Content VERSION -Raw).Trim() }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          python scripts/check_version.py $tag
      - name: Rodar testes de seguranca e funcionamento
        run: python -m unittest discover -s tests -v
      - name: Teste de interface Qt sem tela
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          CALLAS_SMOKE: '1'
        run: python tests/smoke_gui.py
      - name: Gerar aplicativo Windows x64
        run: python scripts/build.py
      - name: Preparar Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 nao instalado' }
      - name: Gerar instalador Windows
        shell: pwsh
        run: |
          $env:CALLAS_VERSION = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\CallasOptimizer.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Erro ao compilar instalador' }
          if (-not (Test-Path "dist/Callas_Optimizer_Setup_x64.exe")) { throw "Setup nao gerado" }
      - name: Validar executaveis e hashes
        run: python scripts/verify_build.py
      - name: Publicar Release estavel (se nova)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:RELEASE_TAG ja publicada. Nao sobrescrever."
            exit 0
          }
          gh release create $env:RELEASE_TAG `
            dist/Callas_Optimizer_Windows_x64.exe `
            dist/Callas_Optimizer_Setup_x64.exe `
            dist/SHA256SUMS.txt `
            --target $env:GITHUB_SHA `
            --title "Callas Optimizer $env:RELEASE_TAG" `
            --notes-file CHANGELOG.md `
            --latest
